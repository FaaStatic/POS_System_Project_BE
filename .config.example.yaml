# Setiap key bisa di-override lewat env var: titik jadi underscore, huruf
# besar (database.pass -> DATABASE_PASS).
server:
  port:
  name:
  env:
  host:
  # IP/CIDR reverse proxy yang dipercaya. Loopback (nginx di host yang sama)
  # selalu dipercaya. Isi bila proxy ada di host/network lain (mis. IP container
  # nginx) agar c.IP() membaca X-Forwarded-For; dari sumber lain header itu
  # diabaikan, jadi client tidak bisa memalsukan IP-nya ke rate limiter.
  trusted_proxies: []
  # Origin CMS web (mis. https://cms.tokoku.id). Kalau diisi, CORS hanya menerima
  # origin ini dengan credentials sehingga cookie refresh token CMS terkirim.
  # Kosong = semua origin tanpa credentials (cocok untuk kasir mobile saja).
  # Cookie memakai SameSite=Strict, jadi CMS dan API harus satu site.
  cms_origins: []
  # Versi di URL API: /api/{api_version}/{group}/{service}. Format v1, v2, ... (kosong = v1).
  # CI/CD mengubahnya lewat SERVER_API_VERSION; FE harus dibangun ulang dengan
  # API_VERSION yang sama.
  api_version: v1
  # Alamat publik API yang terlihat Midtrans (mis. https://api.tokoku.id). Wajib bila
  # midtrans.server_key diisi: backend mengirimnya sebagai URL webhook di tiap charge
  # (<public_url>/api/<versi>/sales/payments/notification), jadi URL di dashboard
  # Midtrans hanya cadangan. Production harus https.
  public_url:
database:
  user:
  pass:
  port:
  dbname:
  host:
  sslmode:
  time_zone:
  # Opsional. Kosong/0 = pakai default (max_open 10, max_idle 5, lifetime 60m).
  # Prefork aktif: tiap proses punya pool sendiri, jadi N proses membuka hingga
  # N×max_open_conns. Naikkan hanya selama totalnya masih di bawah
  # max_connections Postgres.
  max_open_conns:
  max_idle_conns:
  conn_max_lifetime_minutes:
redis:
  url:
  db:
  username:
  password:
  port:
  host:
jwt:
  secret:
  # Nilai dalam DETIK: token_ttl 3600 = 1 jam; refresh_token_ttl 604800 = 7 hari.
  token_ttl:
  refresh_token_ttl:
midtrans:
  # Opsional: kosong = route pembayaran online membalas 503.
  server_key:
  environment:
firebase:
  google_application_credentials:
grafana:
  # Dashboard log (Loki + Grafana, lihat observability/) di http://127.0.0.1:<port>.
  # admin_password WAJIB diisi: make docker-up berhenti kalau kosong, sebab
  # Grafana akan memakai password bawaan "admin". Dipakai saat Grafana pertama
  # kali dijalankan; mengubahnya sesudahnya lewat Grafana (Profile > Change password).
  port:
  admin_password:
